<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HKL-PoMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* Paste the Apps Script web app URL (Deploy > Manage deployments > Web app URL). */
  var API_URL = 'https://script.google.com/macros/s/AKfycbwl-0G_UhQXln0RpIY6ruWDs35jW1JBvXbsRcr8GlIF5_0M0g6E_78p0TZHghwSQO8/exec';
</script>
<style>
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #f8fafb; --line: #e3e8ed; --line-2: #d3dbe2;
  --text: #17222c; --muted: #5d6b78; --faint: #8794a0;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e3f3f1;
  --ok: #157f4a; --ok-soft: #e3f5ea; --warn: #a3620a; --warn-soft: #fcf1dd; --bad: #b42335; --bad-soft: #fbe6e9;
  --info: #285e9b; --info-soft: #e5eef8;
  --shadow: 0 1px 2px rgba(16, 32, 48, .05), 0 4px 16px rgba(16, 32, 48, .05);
  --r: 12px; --r-sm: 8px;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
body[data-role="Supervisor"] { --accent: #2c5282; --accent-soft: #e6edf7; }
body[data-role="Admin"] { --accent: #7b2d42; --accent-soft: #f5e7eb; }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f151b; --surface: #161e26; --surface-2: #1b252e; --line: #26323d; --line-2: #33414e;
    --text: #e6edf3; --muted: #9fb0bf; --faint: #74859a;
    --accent: #2bb3a5; --accent-ink: #06201d; --accent-soft: #123532;
    --ok: #4cc38a; --ok-soft: #12301f; --warn: #e7a54a; --warn-soft: #33260f; --bad: #f2788a; --bad-soft: #3a1820;
    --info: #79a8e0; --info-soft: #172840; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
  body[data-role="Supervisor"] { --accent: #7ea6dc; --accent-ink: #0b1a2c; --accent-soft: #19283d; }
  body[data-role="Admin"] { --accent: #e08aa0; --accent-ink: #2b0d16; --accent-soft: #3a1a24; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }
.mono { font-family: var(--mono); font-feature-settings: 'tnum'; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-weight: 700; letter-spacing: .2px; }
.brand .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pulse { width: 64px; height: 24px; flex: none; }
.pulse path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 130; stroke-dashoffset: 130; animation: beat 2.4s linear infinite; }
@keyframes beat { 0% { stroke-dashoffset: 130; } 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -130; } }
.spacer { flex: 1; }
.who { text-align: right; font-size: 12px; line-height: 1.3; min-width: 0; }
.who b { display: block; font-size: 13px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.sync.busy i { background: var(--warn); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.nav { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { position: relative; padding: 10px 12px 12px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.nav a:hover { color: var(--text); }
.nav a.on { color: var(--accent); }
.nav a.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.nav .count { font: 600 11px var(--mono); background: var(--bad); color: #fff; border-radius: 10px; padding: 1px 6px; }

/* ---------- layout ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 96px; }
.page-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
.page-h h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 700; }
.page-h .sub { color: var(--muted); font-size: 14px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
@media (max-width: 900px) { .g3, .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2 { grid-template-columns: 1fr; } .span2 { grid-column: auto; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h2 .spacer { flex: 1; }
.card + .card { margin-top: 14px; }
.grid > .card + .card { margin-top: 0; }
.stack > * + * { margin-top: 14px; }

/* ---------- stat tiles ---------- */
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); text-align: left; width: 100%; }
button.tile { cursor: pointer; transition: border-color .15s, transform .15s; }
button.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile .k { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.tile .v { font: 600 28px/1.15 var(--mono); margin-top: 4px; }
.tile .s { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.tile.bad .v { color: var(--bad); } .tile.warn .v { color: var(--warn); } .tile.ok .v { color: var(--ok); }

/* ---------- badges / chips ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.green { background: var(--ok); } .dot.amber { background: var(--warn); } .dot.red { background: var(--bad); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 7px 14px; border-radius: var(--r-sm); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ok { color: var(--ok); } .btn.ok:hover { border-color: var(--ok); }
.btn.bad { color: var(--bad); } .btn.bad:hover { border-color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .55; cursor: default; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -16px -16px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.name { font-weight: 600; min-width: 200px; }
td.name .small { font-weight: 400; }
.empty { padding: 28px 12px; text-align: center; color: var(--faint); }

/* ---------- toolbar / inputs ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.input, select.input, textarea.input { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 11px; min-width: 0; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search { flex: 1 1 220px; max-width: 360px; }
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }

/* ---------- progress ---------- */
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.thin { height: 6px; min-width: 70px; }
.ring { position: relative; width: 112px; height: 112px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .lbl b { font: 600 22px var(--mono); }
.ring .lbl span { font-size: 11px; color: var(--muted); }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; padding-bottom: 0; }
.list li:first-child { padding-top: 0; }
.list .main { flex: 1; min-width: 0; }
.list .t { font-weight: 600; }
.list .d { font-size: 13px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 8px; } }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); }
.tl li { position: relative; padding: 0 0 18px 14px; }
.tl li:last-child { padding-bottom: 0; }
.tl li::before { content: ''; position: absolute; left: -26px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-2); }
.tl li.now::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl li.done::before { border-color: var(--ok); background: var(--ok); }
.tl .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tl .place { font-weight: 600; }

/* hero */
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 20px var(--mono); flex: none; }
.hero h1 { font-size: 20px; margin: 0; line-height: 1.25; }
.hero .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

/* bars chart */
.hbars { display: grid; gap: 7px; }
.hbar { display: grid; grid-template-columns: 120px 1fr 34px; gap: 10px; align-items: center; font-size: 13px; background: none; border: 0; padding: 2px 0; text-align: left; cursor: pointer; color: var(--text); }
.hbar:hover .n { color: var(--accent); }
.hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; opacity: .85; }
.hbar .n { font: 600 13px var(--mono); text-align: right; }

/* planner */
.plan { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.plan th, .plan td { padding: 0; border-bottom: 1px solid var(--line); }
.plan th { padding: 8px 4px; text-align: center; text-transform: none; letter-spacing: 0; font-size: 12px; }
.plan th.cur { color: var(--accent); }
.plan td.nm { padding: 6px 12px; white-space: nowrap; font-weight: 600; position: sticky; left: 0; background: var(--surface); z-index: 1; max-width: 240px; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid var(--line); }
.plan td.c { min-width: 64px; height: 34px; padding: 3px 2px; }
.plan td.cur { background: var(--accent-soft); }
.plan .pl { display: block; height: 100%; border-radius: 5px; font-size: 11px; font-weight: 600; padding: 6px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* attention */
.attn li .dot { margin-top: 6px; }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 26, .45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 14px 14px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); border: 1px solid var(--line); }
.modal.wide { max-width: 860px; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.modal-h h3 { margin: 0; font-size: 17px; flex: 1; }
.modal-b { padding: 4px 18px 8px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); margin-top: 8px; }
.form { display: grid; gap: 12px; grid-template-columns: 1fr; }
.modal.wide .form { grid-template-columns: 1fr 1fr; }
.modal.wide .form .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .modal.wide .form { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--faint); }
.field .input { width: 100%; }
.field textarea { min-height: 78px; resize: vertical; }
.preview { background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); padding: 9px 12px; font-weight: 600; font-size: 14px; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: var(--r-sm); padding: 9px 12px; font-size: 14px; }

/* ---------- toast ---------- */
#toasts { position: fixed; z-index: 60; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; width: min(440px, calc(100% - 24px)); }
.toast { background: var(--text); color: var(--bg); padding: 11px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); animation: up .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }

/* ---------- login ---------- */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 14px; }
.login .box { width: 100%; max-width: 420px; }
.login .head { text-align: center; margin-bottom: 18px; }
.login .head .pulse { width: 120px; height: 40px; margin: 0 auto 8px; display: block; }
.login .head .dept { font-size: 13px; color: var(--muted); }
.login .head h1 { font-size: 21px; margin: 4px 0 0; line-height: 1.3; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 16px; }
.seg button { border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.login .card .form { gap: 14px; }
.login .note { font-size: 12.5px; color: var(--faint); text-align: center; margin-top: 14px; }

/* skeleton */
.skel { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 8px; height: 90px; }
@keyframes sk { to { background-position: -200% 0; } }

/* phones: student bottom nav */
@media (max-width: 720px) {
  .who { display: none; }
  .brand .sub { display: none; }
  body[data-role="Student"] .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); z-index: 30; }
  body[data-role="Student"] .nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 4px; }
  body[data-role="Student"] .nav a.on::after { display: none; }
  body[data-role="Student"] .nav a svg { width: 22px; height: 22px; }
  main { padding: 14px 12px 96px; }
  body[data-role="Student"] #toasts { bottom: 84px; }
  .page-h h1 { font-size: 19px; }
  .tile .v { font-size: 24px; }
}
.nav a svg { width: 17px; height: 17px; flex: none; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } .pulse path { stroke-dashoffset: 0; } }
@media print { .top, .toolbar, .btn, #toasts { display: none !important; } main { padding: 0; } .card { box-shadow: none; } }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="box">
    <div class="head">
      <svg class="pulse" viewBox="0 0 120 40" aria-hidden="true"><path d="M2 22 H34 L40 22 L45 8 L52 34 L58 16 L62 22 H118"/></svg>
      <div class="dept" id="lDept">Emergency &amp; Trauma Department · Hospital Kuala Lumpur</div>
      <h1 id="lTitle">HKL Postgraduate Monitoring System</h1>
    </div>
    <div class="card">
      <div class="seg" role="tablist">
        <button type="button" data-role="Student" class="on">Student</button>
        <button type="button" data-role="Supervisor">Supervisor</button>
        <button type="button" data-role="Admin">Admin</button>
      </div>
      <form id="lForm" class="form" autocomplete="on">
        <label class="field" id="lNameF"><span>Your name</span>
          <input class="input" id="lName" list="lNames" autocomplete="off" placeholder="Loading names…" required></label>
        <datalist id="lNames"></datalist>
        <label class="field"><span id="lSecretL">Registered email</span>
          <input class="input" id="lSecret" type="email" required></label>
        <div id="lHint" class="hint small muted"></div>
        <div id="lErr" class="err hidden" role="alert"></div>
        <button class="btn pri" id="lBtn" type="submit">Sign in</button>
      </form>
    </div>
    <div class="note">Your session ends when you close this tab or press Log out.</div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <svg class="pulse" viewBox="0 0 64 24" aria-hidden="true"><path d="M1 13 H18 L21 13 L24 4 L28 20 L31 9 L33 13 H63"/></svg>
        <div><b>HKL-PoMS</b><div class="sub" id="hSub"></div></div>
      </div>
      <div class="spacer"></div>
      <div class="sync" id="sync" title="Saving status"><i></i><span>Up to date</span></div>
      <div class="who"><b id="hName"></b><span id="hRole" class="muted"></span></div>
      <button class="btn sm" id="hOut" type="button">Log out</button>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ======================================================================= API */

var SNAP_KEY = 'poms.snap', TOKEN_KEY = 'poms.token';

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API_URL, {
    method: 'POST', credentials: 'omit', cache: 'no-store', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args })

var NAV = {

  Supervisor: [['students', 'My students', 'users'], ['approvals', 'Approvals', 'check']],

          ['supervisors', 'Supervisors', 'id'], ['settings', 'Settings', 'gear'], ['audit', 'Audit log', 'log']]

function enterApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  document.body.setAttribute('data-role', S.me.role);
  $('hName').textContent = S.me.name;
  $('hRole').textContent = S.me.role;
  $('hSub').textContent = set_().DEPARTMENT_NAME || '';
  if (!location.hash || !routeOk(parseRoute().name)) location.hash = '#/' + NAV[S.me.role][0][0];
  render();
}
function parseRoute() { var p = location.hash.replace(/^#\/?/, '').split('/'); return { name: p[0], id: decodeURIComponent(p[1] || '') }; }
function routeOk(n) { return n === 'student' && S.me.role !== 'Student' || NAV[S.me.role].some(function (x) { return x[0] === n; }); }
function go(r) { location.hash = '#/' + r; }
window.addEventListener('hashchange', function () { if (S.d) { render(); window.scrollTo(0, 0); } });

function approvalsCount() {
  if (S.me.role === 'Student') return 0;
  return S.d.students.reduce(function (n, s) {
    var p = pendingFor(s.id);
    return n + p.leaves.length + p.ms.length + (S.me.role === 'Admin' ? p.ext.length : 0);
  }, 0);
}

function render() {
  if (!S.d) return;
  var r = parseRoute();
  if (!routeOk(r.name)) { go(NAV[S.me.role][0][0]); return; }
  var navOn = r.name === 'student' ? 'students' : r.name;
  var pend = approvalsCount();
  $('nav').innerHTML = NAV[S.me.role].map(function (n) {
    return '<a href="#/' + n[0] + '" class="' + (n[0] === navOn ? 'on' : '') + '"' + (n[0] === navOn ? ' aria-current="page"' : '') + '>' + svgIcon(n[2]) + '<span>' + n[1] + '</span>' +
      (n[0] === 'approvals' && pend ? '<span class="count">' + pend + '</span>' : '') + '</a>';
  }).join('');
  var V = VIEWS[S.me.role][r.name] || VIEWS.common[r.name];
  var html;
  try { html = V(r.id); } catch (e) { console.error(e); html = card('This screen could not be drawn', '<p class="muted">' + esc(e.message) + '</p>'); }
  var main = $('view');
  // Keep typing focus in search boxes while re-rendering.
  var active = document.activeElement, keep = active && active.id && main.contains(active) ? { id: active.id, s: active.selectionStart } : null;
  main.innerHTML = html;
  if (keep && $(keep.id)) { var el = $(keep.id); el.focus(); try { el.setSelectionRange(keep.s, keep.s); } catch (e) {} }
}

function leaveForm(o, cb) {
  var l = o.leave || {}, types = list(set_().LEAVE_TYPES);

    { name: 'startDate', label: 'From', type: 'date', value: l.startDate || '', required: true },
    { name: 'endDate', label: 'To', type: 'date', value: l.endDate || '', hint: 'Leave empty for a single day.' },
    { name: 'halfDay', label: 'Half day (single day only)', type: 'checkbox', value: l.halfDay },
    { name: 'reason', label: 'Reason', type: 'textarea', value: l.reason || '', max: 500 }
  ];
  if (o.admin) fields.push({ name: 'status', label: 'Status', type: 'select', options: ['Pending', 'Approved', 'Rejected', 'Cancelled'], value: l.status },
                           { name: 'decisionNote', label: 'Decision note', type: 'text', value: l.decisionNote || '' });

    preview: function (v) {

      return plural(n, 'working day') + ' (weekends and public holidays skipped)' + (b && !o.leave ? ' · ' + (b.left - n) + ' ' + v.type.toLowerCase() + ' days left after this' : '');
    },
    validate: function (v) {
      var end = v.endDate || v.startDate;
      if (end < v.startDate) return 'The end date is before the start date.';
      if (!workingDays(v.startDate, end, v.halfDay)) return 'Those dates are all weekends or public holidays.';
      return '';

document.addEventListener('click', function (e) {
  if (!S.d) return;
  var a = e.target.closest('[data-act]');
  if (a && $('app').contains(a) || a && $('modalRoot').contains(a)) {
    var fn = A[a.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(a.getAttribute('data-id'), a); return; }
  }
  var g = e.target.closest('[data-go]');
  if (g && !e.target.closest('a')) { e.preventDefault(); go(g.getAttribute('data-go')); }
});
document.addEventListener('input', function (e) {
  if (!S.d) return;
  if (e.target.id === 'aq') { S.ui.q = e.target.value; render(); }
  if (e.target.id === 'sq') { S.ui.sq = e.target.value; render(); }
});
document.addEventListener('change', function (e) {
  if (!S.d) return;

  if (k) { S.ui.f[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; delete S.ui.f.soon; delete S.ui.f.noEmail; render(); }
  if (e.target.getAttribute('data-act-change') === 'planUni') { S.ui.planUni = e.target.value; render(); }
});

/* Refresh quietly when the tab comes back after a while, so data from other users shows up. */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !S.token || !S.d || S.busy || MODAL) return;
  if (Date.now() - S.loadedAt < 5 * 60 * 1000) return;
  backgroundRefresh();
});
function backgroundRefresh() {
  var tok = S.token;
  busy(1);
  return api('bootstrap', tok).then(function (d) { if (S.token === tok) { setData(d); render(); } }, function () {}).finally(function () { busy(-1); });
}

(function start() {

  }
  var tok = null, snap = null;
  try { tok = sessionStorage.getItem(TOKEN_KEY); snap = JSON.parse(sessionStorage.getItem(SNAP_KEY) || 'null'); } catch (e) {}
  if (tok && snap && snap.me) {
    // Show the last data instantly, then refresh in the background.
    S.token = tok; setData(snap); enterApp(); backgroundRefresh();

})();
