<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HKL-PoMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* Paste the Apps Script web app URL (Deploy > Manage deployments > Web app URL). */
  var API_URL = 'https://script.google.com/macros/s/AKfycbwl-0G_UhQXln0RpIY6ruWDs35jW1JBvXbsRcr8GlIF5_0M0g6E_78p0TZHghwSQO8/exec';
</script>
<style>
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #f8fafb; --line: #e3e8ed; --line-2: #d3dbe2;
  --text: #17222c; --muted: #5d6b78; --faint: #8794a0;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e3f3f1;
  --ok: #157f4a; --ok-soft: #e3f5ea; --warn: #a3620a; --warn-soft: #fcf1dd; --bad: #b42335; --bad-soft: #fbe6e9;
  --info: #285e9b; --info-soft: #e5eef8;
  --shadow: 0 1px 2px rgba(16, 32, 48, .05), 0 4px 16px rgba(16, 32, 48, .05);
  --r: 12px; --r-sm: 8px;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
body[data-role="Supervisor"] { --accent: #2c5282; --accent-soft: #e6edf7; }
body[data-role="Admin"] { --accent: #7b2d42; --accent-soft: #f5e7eb; }
/* Always the light theme, even when the device is set to dark mode (owner's choice). */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
body { min-height: 100vh; -webkit-font-smoothing: antialiased; background: transparent; }
/* Faded photo of the HKL link bridge behind every screen; the plain page colour shows through it. */
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: url('bg.jpg') center / cover no-repeat; opacity: .2; pointer-events: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }
.mono { font-family: var(--mono); font-feature-settings: 'tnum'; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-weight: 700; letter-spacing: .2px; }
.brand .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pulse { width: 64px; height: 24px; flex: none; }
.pulse path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 130; stroke-dashoffset: 130; animation: beat 2.4s linear infinite; }
@keyframes beat { 0% { stroke-dashoffset: 130; } 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -130; } }
.spacer { flex: 1; }
.who { text-align: right; font-size: 12px; line-height: 1.3; min-width: 0; }
.who b { display: block; font-size: 13px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.sync.busy i { background: var(--warn); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.nav { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { position: relative; padding: 10px 12px 12px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.nav a:hover { color: var(--text); }
.nav a.on { color: var(--accent); }
.nav a.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.nav .count { font: 600 11px var(--mono); background: var(--bad); color: #fff; border-radius: 10px; padding: 1px 6px; }

/* ---------- layout ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 96px; }
.page-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
.page-h h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 700; }
.page-h .sub { color: var(--muted); font-size: 14px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
@media (max-width: 900px) { .g3, .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2 { grid-template-columns: 1fr; } .span2 { grid-column: auto; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h2 .spacer { flex: 1; }
.card + .card { margin-top: 14px; }
.grid > .card + .card { margin-top: 0; }
.stack > * + * { margin-top: 14px; }

/* ---------- stat tiles ---------- */
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); text-align: left; width: 100%; }
button.tile { cursor: pointer; transition: border-color .15s, transform .15s; }
button.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile .k { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.tile .v { font: 600 28px/1.15 var(--mono); margin-top: 4px; }
.tile .s { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.tile.bad .v { color: var(--bad); } .tile.warn .v { color: var(--warn); } .tile.ok .v { color: var(--ok); }

/* ---------- badges / chips ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.green { background: var(--ok); } .dot.amber { background: var(--warn); } .dot.red { background: var(--bad); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 7px 14px; border-radius: var(--r-sm); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ok { color: var(--ok); } .btn.ok:hover { border-color: var(--ok); }
.btn.bad { color: var(--bad); } .btn.bad:hover { border-color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .55; cursor: default; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -16px -16px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.name { font-weight: 600; min-width: 200px; }
td.name .small { font-weight: 400; }
.empty { padding: 28px 12px; text-align: center; color: var(--faint); }

/* ---------- toolbar / inputs ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.input, select.input, textarea.input { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 11px; min-width: 0; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search { flex: 1 1 220px; max-width: 360px; }
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }

/* ---------- progress ---------- */
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.thin { height: 6px; min-width: 70px; }
.ring { position: relative; width: 112px; height: 112px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .lbl b { font: 600 22px var(--mono); }
.ring .lbl span { font-size: 11px; color: var(--muted); }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; padding-bottom: 0; }
.list li:first-child { padding-top: 0; }
.list .main { flex: 1; min-width: 0; }
.list .t { font-weight: 600; }
.list .d { font-size: 13px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 8px; } }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); }
.tl li { position: relative; padding: 0 0 18px 14px; }
.tl li:last-child { padding-bottom: 0; }
.tl li::before { content: ''; position: absolute; left: -26px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-2); }
.tl li.now::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl li.done::before { border-color: var(--ok); background: var(--ok); }
.tl .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tl .place { font-weight: 600; }

/* hero */
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 20px var(--mono); flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
.avatar.lg { width: 84px; height: 84px; font-size: 28px; }
.hero h1 { font-size: 20px; margin: 0; line-height: 1.25; }
.hero .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

/* bars chart */
.hbars { display: grid; gap: 7px; }
.hbar { display: grid; grid-template-columns: 120px 1fr 34px; gap: 10px; align-items: center; font-size: 13px; background: none; border: 0; padding: 2px 0; text-align: left; cursor: pointer; color: var(--text); }
.hbar:hover .n { color: var(--accent); }
.hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; opacity: .85; }
.hbar .n { font: 600 13px var(--mono); text-align: right; }

/* planner */
.plan { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.plan th, .plan td { padding: 0; border-bottom: 1px solid var(--line); }
.plan th { padding: 8px 4px; text-align: center; text-transform: none; letter-spacing: 0; font-size: 12px; }
.plan th.cur { color: var(--accent); }
.plan td.nm { padding: 6px 12px; white-space: nowrap; font-weight: 600; position: sticky; left: 0; background: var(--surface); z-index: 1; max-width: 240px; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid var(--line); }
.plan td.c { min-width: 64px; height: 34px; padding: 3px 2px; }
.plan td.cur { background: var(--accent-soft); }
.plan .pl { display: block; height: 100%; border-radius: 5px; font-size: 11px; font-weight: 600; padding: 6px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* attention */
.attn li .dot { margin-top: 6px; }

/* ---------- progress review: green circle / amber triangle / red square, so colour is never the only cue ---------- */
:root { --st-green: #0ca30c; --st-amber: #fab219; --st-red: #d03b3b; }
.lamp { width: 12px; height: 12px; display: inline-block; flex: none; }
.lamp.green { background: var(--st-green); border-radius: 50%; }
.lamp.amber { background: var(--st-amber); clip-path: polygon(50% 2%, 100% 98%, 0 98%); }
.lamp.red { background: var(--st-red); border-radius: 2px; }
.lamp.none { border: 1.5px solid var(--line-2); border-radius: 50%; }
.lamps { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
.lamps.old { opacity: .45; }
.rv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .rv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rv { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface-2); min-width: 0; }
.rv.green { background: color-mix(in srgb, var(--st-green) 11%, var(--surface)); border-color: color-mix(in srgb, var(--st-green) 35%, var(--line)); }
.rv.amber { background: color-mix(in srgb, var(--st-amber) 16%, var(--surface)); border-color: color-mix(in srgb, var(--st-amber) 50%, var(--line)); }
.rv.red { background: color-mix(in srgb, var(--st-red) 11%, var(--surface)); border-color: color-mix(in srgb, var(--st-red) 40%, var(--line)); }
.rv .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.rv .v { display: flex; gap: 7px; align-items: center; font-weight: 600; font-size: 14px; margin-top: 5px; line-height: 1.25; }
.rv .v.unrated { color: var(--faint); font-weight: 500; }
.rv-head { margin-bottom: 12px; }
.rv-head .t { font-weight: 600; }
.rv-foot { margin-top: 10px; font-size: 13px; color: var(--muted); }
.rv-note { margin-top: 10px; padding: 9px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 14px; }
.sbars { display: grid; gap: 9px; }
.srow { display: grid; grid-template-columns: 150px 1fr 150px; gap: 12px; align-items: center; font-size: 13px; }
.srow .lab { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .n { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.srow .n span { display: inline-flex; gap: 4px; align-items: center; }
.sbar { display: flex; gap: 2px; height: 14px; }
.sbar i { display: block; height: 100%; min-width: 4px; border-radius: 3px; }
.sbar i.green { background: var(--st-green); } .sbar i.amber { background: var(--st-amber); } .sbar i.red { background: var(--st-red); } .sbar i.none { background: var(--line-2); }
@media (max-width: 640px) { .srow { grid-template-columns: 1fr; gap: 3px; } }

/* ---------- report ---------- */
.slide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 24px 28px; margin-bottom: 16px; }
.slide h2 { font-size: 20px; margin: 0 0 4px; line-height: 1.25; }
.slide .lead { color: var(--muted); margin: 0 0 16px; }
.slide.cover { padding: 56px 40px; }
.slide.cover h2 { font-size: 34px; margin: 10px 0 6px; }
.slide.cover .meta { margin-top: 22px; }
.slide .cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .slide .cols { grid-template-columns: 1fr; } }
.slide .kv { grid-template-columns: 150px 1fr; }
.slide .sup { text-align: right; font-size: 13px; }
@page { size: A4 landscape; margin: 10mm; }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 26, .45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 14px 14px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); border: 1px solid var(--line); }
.modal.wide { max-width: 860px; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.modal-h h3 { margin: 0; font-size: 17px; flex: 1; }
.modal-b { padding: 4px 18px 8px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); margin-top: 8px; }
.form { display: grid; gap: 12px; grid-template-columns: 1fr; }
.modal.wide .form { grid-template-columns: 1fr 1fr; }
.modal.wide .form .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .modal.wide .form { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--faint); }
.field .input { width: 100%; }
.field textarea { min-height: 78px; resize: vertical; }
.preview { background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); padding: 9px 12px; font-weight: 600; font-size: 14px; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: var(--r-sm); padding: 9px 12px; font-size: 14px; }

/* ---------- toast ---------- */
#toasts { position: fixed; z-index: 60; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; width: min(440px, calc(100% - 24px)); }
.toast { background: var(--text); color: var(--bg); padding: 11px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); animation: up .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }

/* ---------- login ---------- */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 14px; }
.login .box { width: 100%; max-width: 420px; }
.login .head { text-align: center; margin-bottom: 18px; }
.login .head .pulse { width: 120px; height: 40px; margin: 0 auto 8px; display: block; }
.login .head .dept { font-size: 13px; color: var(--muted); }
.login .head h1 { font-size: 21px; margin: 4px 0 0; line-height: 1.3; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 16px; }
.seg button { border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.login .card .form { gap: 14px; }
/* Name suggestions on the sign-in box: our own list, because the browser's built-in one often fails to open. */
.ac { position: relative; }
.ac-list { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--r-sm); box-shadow: 0 8px 24px rgba(16, 32, 48, .16); max-height: 232px; overflow-y: auto; overscroll-behavior: contain; }
.ac-list li { padding: 9px 10px; border-radius: 6px; font-size: 14px; cursor: pointer; }
.ac-list li.on, .ac-list li:hover { background: var(--accent-soft); color: var(--accent); }
.ac-list li.none { color: var(--muted); cursor: default; background: none; }
.login .note { font-size: 12.5px; color: var(--faint); text-align: center; margin-top: 14px; }

/* skeleton */

<script>
'use strict';
/* ======================================================================= API */

var SNAP_KEY = 'poms.snap', TOKEN_KEY = 'poms.token';

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);

    method: 'POST', credentials: 'omit', cache: 'no-store', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },

}

/* ===================================================================== STATE */

var S = { token: null, me: null, d: null, route: '', loadedAt: 0, ui: { f: {}, sf: {}, q: '', sq: '', rep: { period: '', ic: false, unrated: true } }, busy: 0 };
var TABLE_KEY = { Students: 'students', Supervisors: 'supervisors', Admins: 'admins', Postings: 'postings',
                  Leaves: 'leaves', Milestones: 'milestones', Holidays: 'holidays', Reviews: 'reviews', Registrations: 'registrations' };

function saveSnap() {
  try { sessionStorage.setItem(TOKEN_KEY, S.token); sessionStorage.setItem(SNAP_KEY, JSON.stringify(S.d)); } catch (e) {}
}
function clearSnap() { try { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(SNAP_KEY); } catch (e) {} }

function setData(d) {
  S.d = d; S.me = d.me; S.loadedAt = Date.now();
  index();
  saveSnap();
}

/** Lookup maps rebuilt after every change. */
var IX = {};
function index() {
  var d = S.d;
  ['students', 'supervisors', 'postings', 'leaves', 'milestones', 'holidays', 'admins', 'reviews', 'registrations'].forEach(function (k) { d[k] = d[k] || []; });
  IX.stu = {}; d.students.forEach(function (s) { IX.stu[s.id] = s; });
  IX.sup = {}; d.supervisors.forEach(function (s) { IX.sup[s.id] = s; });
  IX.by = { postings: {}, leaves: {}, milestones: {}, reviews: {} };
  ['postings', 'leaves', 'milestones', 'reviews'].forEach(function (k) {
    d[k].forEach(function (r) { (IX.by[k][r.studentId] = IX.by[k][r.studentId] || []).push(r); });
  });
  IX.off = {}; d.holidays.forEach(function (h) { IX.off[h.date] = h.name; });
}
function of(kind, sid) { return IX.by[kind][sid] || []; }

function merge(res) {
  var d = S.d;
  Object.keys(res.changed || {}).forEach(function (t) {
    var k = TABLE_KEY[t]; if (!k) return;
    d[k] = (d[k] || []).filter(function (r) { return String(r.id).indexOf('tmp-') !== 0; });

  });
  Object.keys(res.removed || {}).forEach(function (t) {
    var k = TABLE_KEY[t]; if (!k) return;
    d[k] = d[k].filter(function (r) { return res.removed[t].indexOf(r.id) < 0; });
  });
  if (res.settings) d.settings = res.settings;
  if (res.reviewPeriod && d.review) d.review.period = res.reviewPeriod;
  index();
  saveSnap();
}

/** Save with instant feedback: change the screen first, roll back if the server says no. */
function run(action, payload, opt) {
  opt = opt || {};

  if (opt.optimistic) { opt.optimistic(S.d); index(); render(); }
  busy(1);
  return api('act', S.token, action, payload).then(function (res) {
    merge(res); render();
    if (opt.done) toast(opt.done, 'ok');
    // Lines the server adds after a save, e.g. whether an email went out.
    (res.notes || []).forEach(function (n) { toast(n, /could not/.test(n) ? 'bad' : 'ok'); });
    return res;
  }, function (e) {
    S.d = JSON.parse(before); index(); render();
    toast(e.message, 'bad');
    throw e;
  }).finally(function () { busy(-1); });
}

    home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',

    check: 'M4 12l5 5L20 6',
    grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',

    id: 'M3 5h18v14H3zM8 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM5 16a3 3 0 0 1 6 0M14 9h4M14 13h4'

}

/* ================================================================== DERIVED */

function timing(p) {
  var t = today();
  if (!p.startDate && !p.endDate) return { key: 'none', label: 'No dates', cls: '' };
  if (p.endDate && p.endDate < t) return { key: 'done', label: 'Completed', cls: 'ok' };
  if (p.startDate && p.startDate > t) return { key: 'next', label: 'Upcoming', cls: 'info' };
  return { key: 'now', label: 'Current', cls: 'acc' };
}
function postingsOf(sid) {
  return of('postings', sid).slice().sort(function (a, b) {
    return (a.startDate || '9999').localeCompare(b.startDate || '9999') || (+a.round || 0) - (+b.round || 0);
  });
}
function currentPosting(sid) {
  return postingsOf(sid).filter(function (p) { return p.status === 'Approved' && timing(p).key === 'now'; }).pop() || null;
}
function nextPosting(sid) {
  return postingsOf(sid).filter(function (p) { return p.status === 'Approved' && timing(p).key === 'next'; })[0] || null;
}
function thesis(sid) {
  var ms = of('milestones', sid).slice().sort(function (a, b) { return (+a.order || 0) - (+b.order || 0); });
  var done = ms.filter(function (m) { return m.status === 'Verified'; }).length;
  return { ms: ms, done: done, total: ms.length, pct: ms.length ? Math.round(done * 100 / ms.length) : 0 };
}
function leaveSum(sid) {
  var st = IX.stu[sid] || {}, yr = today().slice(0, 4);
  var out = { annual: { ent: +st.leaveEntitlement || num('ANNUAL_LEAVE_ENTITLEMENT', 30), used: 0, pending: 0 },

    var b = l.type === 'Annual' ? out.annual : l.type === 'Emergency' ? out.emergency : null;
    var d = +l.days || 0;
    if (l.status === 'Approved') { if (b) b.used += d; else out.otherUsed += d; }
    if (l.status === 'Pending' && b) b.pending += d;

  out.emergency.left = out.emergency.ent - out.emergency.used;

}
/** A posting's place, with the HKL rotation when one is recorded: "HKL · Anaesthesiology". */
function postLabel(p) { return p.dept ? p.place + ' · ' + p.dept : p.place; }

function rotationFields(cur, required) {
  var opts = list(set_().HKL_ROTATIONS), known = !cur || opts.indexOf(cur) > -1;
  return [
    { name: 'deptPick', label: 'HKL posting', type: 'select', required: required, value: cur ? (known ? cur : 'Others') : '',
      options: [{ value: '', label: required ? '— choose —' : '— not applicable —' }].concat(opts, ['Others']) },
    { name: 'deptOther', label: 'Others: please state', value: known ? '' : cur, max: 60, when: function (v) { return v.deptPick === 'Others'; } }

}
function rotationOf(v) { return v.deptPick === 'Others' ? v.deptOther : v.deptPick; }

}

  if (st.endDate && st.endDate < t && !st.archived) bump(2, 'Study end date (' + fd(st.endDate) + ') has passed');

/* ---- progress review ---- */

var LAMP_WORD = { green: 'green', amber: 'amber', red: 'red', none: 'not rated' };
function scheme() { return (S.d.review && S.d.review.scheme) || []; }
function period() { return (S.d.review && S.d.review.period) || ''; }
function rateColor(f, v) { var o = f.options.filter(function (x) { return x[0] === v; })[0]; return o ? o[1] : 'none'; }
function reviewsOf(sid) {
  return of('reviews', sid).slice().sort(function (a, b) { return String(b.ratedAt || '').localeCompare(String(a.ratedAt || '')); });
}
function reviewIn(sid, per) { return of('reviews', sid).filter(function (r) { return r.period === per; })[0] || null; }
/** Made-up ratings added by the admin for demonstration; always labelled, never shown to students. */
function isSample(rv) { return !!rv && !!S.d.review && !!S.d.review.sampleRater && rv.ratedBy === S.d.review.sampleRater; }
function sampleBadge(rv) { return isSample(rv) ? '<span class="badge warn">Sample data</span>' : ''; }
function samples(per) { return S.d.reviews.filter(function (r) { return isSample(r) && (!per || r.period === per); }); }

function worst(rv) {

}
function lamp(color, tip) {

}
function lamps(rv, old) {
  if (!rv) return '<span class="faint small">Not rated</span>';
  return '<span class="lamps' + (old ? ' old' : '') + '">' + scheme().map(function (f) {

}

  return '<div class="legend">' + [['green', 'On track'], ['amber', 'Needs monitoring'], ['red', 'Behind'], ['none', 'Not rated']].map(function (x) {
    return '<span>' + lamp(x[0]) + esc(x[1]) + '</span>';
  }).join('') + '</div>';
}
/** Where the research stands, read from the dissertation milestones. */
function researchStage(sid) {
  var st = IX.stu[sid] || {}, th = thesis(sid);
  if (!th.total) return '';
  if (th.done === th.total) return 'Completed';
  var cur = th.ms.filter(function (m) { return m.status !== 'Verified'; })[0];
  if (cur === th.ms[0] && cur.status === 'Not started' && !st.researchTitle) return 'No topic yet';
  return cur.name;
}
function reviewTiles(rv) {
  return '<div class="rv-grid">' + scheme().map(function (f) {
    var v = rv && rv[f.key], c = rateColor(f, v);
    return '<div class="rv ' + c + '"><div class="k">' + esc(f.label) + '</div><div class="v' + (v ? '' : ' unrated') + '">' + lamp(c) + '<span>' + esc(v || 'Not rated') + '</span></div></div>';
  }).join('') + '</div>';
}
function researchHead(sid) {

    (stage ? '<div class="small muted">Stage: ' + esc(stage) + '</div>' : '') + '</div>';
}
/** The eight-tile dashboard for one student, newest rating first, older periods listed underneath. */
function reviewCard(sid, canRate) {
  if (!scheme().length) return '';
  var all = reviewsOf(sid), rv = all[0], cur = period(), isCur = rv && rv.period === cur;
  var body = researchHead(sid);
  if (rv) {
    body += reviewTiles(rv) + (rv.comment ? '<div class="rv-note"><span class="muted small">Supervisor comment</span><br>' + esc(rv.comment) + '</div>' : '') +
      '<div class="rv-foot">Rated by ' + esc(rv.ratedBy || '—') + ' · ' + fd(String(rv.ratedAt || '').slice(0, 10)) + '</div>';
    if (all.length > 1) body += '<ul class="list" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">' + all.slice(1).map(function (r) {
      return '<li><div class="main small"><b>' + esc(r.period) + '</b> <span class="faint">· ' + esc(r.ratedBy || '') + '</span></div>' + lamps(r) + '</li>';
    }).join('') + '</ul>';
  } else body += '<p class="muted" style="margin:0">' + (canRate ? 'No rating yet. Use “Rate progress” to record the first one.' : 'Your supervisor has not recorded a rating yet.') + '</p>';
  return card('Progress review ' + (rv ? '<span class="badge' + (isCur ? ' acc' : '') + '">' + esc(rv.period) + '</span>' : '') + sampleBadge(rv) +
    (rv && !isCur ? '<span class="badge warn">Not yet rated for ' + esc(cur) + '</span>' : ''), body,
    canRate ? (rv ? '<button class="btn sm" data-act="rateClear" data-id="' + esc(rv.id) + '">Clear rating</button>' : '') +

/* ---- name suggestions: opens when the name box is tapped, narrows as you type ---- */
var AC = { rows: [], idx: -1 };
function loginNames() { return (LOGIN.opts && (LOGIN.role === 'Student' ? LOGIN.opts.students : LOGIN.opts.supervisors)) || []; }

function nameMatches(q) {
  var typed = String(q).toUpperCase().trim(), words = typed.split(/\s+/).filter(Boolean);
  var rank = function (n) { var u = n.toUpperCase(); return u === typed ? 0 : u.indexOf(typed) === 0 ? 1 : 2; };   // exact, then starts-with, then the rest
  return loginNames().filter(function (n) { var u = n.toUpperCase(); return words.every(function (w) { return u.indexOf(w) > -1; }); })
    .map(function (n, i) { return [rank(n), i, n]; }).sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; }).map(function (x) { return x[2]; });
}
function acHide() { $('lList').classList.add('hidden'); $('lName').setAttribute('aria-expanded', 'false'); $('lName').removeAttribute('aria-activedescendant'); AC.idx = -1; }
function acMark(i) {
  AC.idx = i;

  for (var k = 0; k < items.length; k++) { items[k].classList.toggle('on', k === i); items[k].setAttribute('aria-selected', k === i ? 'true' : 'false'); }
  if (i >= 0 && items[i]) { $('lName').setAttribute('aria-activedescendant', items[i].id); items[i].scrollIntoView({ block: 'nearest' }); }

}
function acShow() {

  var q = inp.value.trim();
  AC.rows = nameMatches(q);
  if (AC.rows.length === 1 && AC.rows[0].toUpperCase() === q.toUpperCase()) { acHide(); return; }   // already chosen
  box.innerHTML = AC.rows.length ? AC.rows.map(function (n, i) { return '<li role="option" id="lOpt' + i + '" data-i="' + i + '">' + esc(n) + '</li>'; }).join('')
    : '<li class="none">No name matches. Check that “' + esc(LOGIN.role) + '” above is the right choice, or ask the department admin.</li>';

function acPick(name) {

}
(function () {
  var inp = $('lName'), box = $('lList');

  inp.addEventListener('input', acShow);

  inp.addEventListener('keydown', function (e) {
    var open = !box.classList.contains('hidden');

function enterApp() {

function parseRoute() { var p = location.hash.replace(/^#\/?/, '').split('/'); return { name: p[0], id: decodeURIComponent(p[1] || '') }; }
function routeOk(n) { return n === 'student' && S.me.role !== 'Student' || NAV[S.me.role].some(function (x) { return x[0] === n; }); }
function go(r) { location.hash = '#/' + r; }
window.addEventListener('hashchange', function () { if (S.d) { render(); window.scrollTo(0, 0); } });

/** Admin only: new students who signed up and are waiting to be approved, oldest first. */
function pendingRegs() {
  return (S.d.registrations || []).filter(function (r) { return r.status === 'Pending'; })
    .sort(function (a, b) { return String(a.submittedAt).localeCompare(String(b.submittedAt)); });
}
function approvalsCount() {
  if (S.me.role === 'Student') return 0;
  return S.d.students.reduce(function (n, s) {
    var p = pendingFor(s.id);
    return n + p.leaves.length + p.ms.length + (S.me.role === 'Admin' ? p.ext.length : 0);
  }, S.me.role === 'Admin' ? pendingRegs().length : 0);
}

function render() {
  if (!S.d) return;
  var r = parseRoute();
  if (!routeOk(r.name)) { go(NAV[S.me.role][0][0]); return; }
  var navOn = r.name === 'student' ? 'students' : r.name;
  var pend = approvalsCount();
  $('nav').innerHTML = NAV[S.me.role].map(function (n) {
    return '<a href="#/' + n[0] + '" class="' + (n[0] === navOn ? 'on' : '') + '"' + (n[0] === navOn ? ' aria-current="page"' : '') + '>' + svgIcon(n[2]) + '<span>' + n[1] + '</span>' +
      (n[0] === 'approvals' && pend ? '<span class="count">' + pend + '</span>' : '') + '</a>';
  }).join('');
  var V = VIEWS[S.me.role][r.name] || VIEWS.common[r.name];
  var html;
  try { html = V(r.id); } catch (e) { console.error(e); html = card('This screen could not be drawn', '<p class="muted">' + esc(e.message) + '</p>'); }
  var main = $('view');
  // Keep typing focus in search boxes while re-rendering.
  var active = document.activeElement, keep = active && active.id && main.contains(active) ? { id: active.id, s: active.selectionStart } : null;
  main.innerHTML = html;
  if (keep && $(keep.id)) { var el = $(keep.id); el.focus(); try { el.setSelectionRange(keep.s, keep.s); } catch (e) {} }
  loadPhotos();
}

function adminFilterRows() {
  var f = S.ui.f, q = S.ui.q.toLowerCase(), t = today();
  return S.d.students.filter(function (s) {
    if (!f.archived && s.archived) return false;
    if (f.archived && !s.archived) return false;
    if (f.status && s.status !== f.status) return false;
    if (f.university && s.university !== f.university) return false;
    if (f.year && yearLabel(s) !== f.year) return false;
    if (f.supervisor && s.supervisorId !== f.supervisor) return false;
    if (f.risk && risk(s.id).level !== f.risk) return false;
    if (f.progress && worst(reviewIn(s.id, period())) !== f.progress) return false;
    if (f.noEmail && s.email) return false;
    if (f.soon) { var cp = currentPosting(s.id); if (!cp || !cp.endDate || daysBetween(t, cp.endDate) > num('POSTING_ENDING_SOON_DAYS', 60)) return false; }
    if (q && (s.name + ' ' + s.mmc + ' ' + s.email + ' ' + s.dept + ' ' + s.university).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.name.localeCompare(b.name); });
}

/** Meeting slides built from the ratings: cover, summary, supervisor list, then one slide per trainee. */
VIEWS.Admin.report = function () {
  var ui = S.ui.rep, cur = period();
  var periods = {}; periods[cur] = 1;
  S.d.reviews.forEach(function (r) { if (r.period) periods[r.period] = 1; });
  var per = periods[ui.period] ? ui.period : cur;
  var active = S.d.students.filter(function (s) { return !s.archived; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  var rated = active.filter(function (s) { return reviewIn(s.id, per); });
  var shown = ui.unrated ? active : rated;
  var groups = {}, order = [];
  shown.forEach(function (s) { var k = s.supervisorId || ''; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(s); });
  order.sort(function (a, b) { return (a ? 0 : 1) - (b ? 0 : 1) || supName(a).localeCompare(supName(b)); });
  var count = function (c) { return rated.filter(function (s) { return worst(reviewIn(s.id, per)) === c; }).length; };
  var set = set_(), nSample = samples(per).length, nSampleAll = samples().length;

  var cover = '<section class="slide cover"><div class="muted">' + esc(set.DEPARTMENT_NAME || '') + '</div><h2>Trainee Progress Review</h2>' +
    '<div class="lead">' + esc(set.SYSTEM_NAME || 'HKL-PoMS') + '</div><div class="meta hero"><span class="badge acc">' + esc(per) + '</span>' +
    '<span class="badge">Prepared ' + fd(today()) + '</span><span class="badge">' + plural(shown.length, 'trainee') + ' · ' + plural(order.filter(Boolean).length, 'supervisor') + '</span>' +
    (nSample ? '<span class="badge warn">Includes ' + plural(nSample, 'sample rating') + ' (not real)</span>' : '') + '</div></section>';

  var summary = '<section class="slide"><h2>Summary</h2><p class="lead">' + rated.length + ' of ' + active.length + ' active trainees rated for ' + esc(per) + '</p>' +
    '<div class="grid g4" style="margin-bottom:18px">' + tile('Trainees', active.length, 'active') + tile('All green', count('green'), 'every rated item on track', 'ok') +
    tile('Needs monitoring', count('amber'), 'amber, no red', count('amber') ? 'warn' : '') + tile('Behind', count('red'), 'at least one red item', count('red') ? 'bad' : '') + '</div>' +
    reviewBars(active, per) + '<div style="margin-top:14px">' + lampLegend() + '</div></section>';

  var alloc = '<section class="slide"><h2>Supervisors and trainees</h2><p class="lead">The mark beside each name is the trainee\'s worst rating this period</p>' +
    '<table><thead><tr><th>EDHKL supervisor</th><th>Trainees</th><th style="text-align:right">Load</th></tr></thead><tbody>' + order.map(function (k) {
      return '<tr><td class="name">' + esc(k ? supName(k) : 'No supervisor assigned') + '</td><td>' + groups[k].map(function (s) {
        return '<div style="display:flex;gap:8px;align-items:center;padding:2px 0">' + lamp(worst(reviewIn(s.id, per))) + '<span>' + esc(s.name) + ' <span class="faint small">' + esc(s.university || '') + '</span></span></div>';
      }).join('') + '</td><td class="mono" style="text-align:right">' + groups[k].length + '</td></tr>';
    }).join('') + '</tbody></table></section>';

  var slides = order.map(function (k) {
    return groups[k].map(function (s) {
      var rv = reviewIn(s.id, per), cp = currentPosting(s.id);
      var done = postingsOf(s.id).filter(function (p) { return p.status === 'Approved' && timing(p).key === 'done'; }).map(postLabel);
      var facts = (ui.ic ? [['IC', s.ic]] : []).concat([
        ['Reported', fd(s.reportDate)], ['In department', s.reportDate || s.endDate ? fd(s.reportDate) + ' – ' + fd(s.endDate) : ''], ['Status', s.status],
        ['Current posting', cp ? postLabel(cp) + ' (' + fd(cp.startDate) + ' – ' + fd(cp.endDate) + ')' : s.dept],
        ['Postings completed', done.join(', ')], ['University supervisor', s.uniSupervisor]]);
      return '<section class="slide"><div class="hero" style="margin-bottom:18px">' + avatar(s, 'lg') + '<div style="flex:1;min-width:220px"><h2>' + esc(s.name) + ' ' + sampleBadge(rv) + '</h2>' +
        '<div class="muted">' + esc([s.program, s.university, yearLabel(s)].filter(Boolean).join(' · ')) + '</div></div>' +
        '<div class="sup"><div class="muted">EDHKL supervisor</div><b>' + esc(k ? supName(k) : 'Not assigned') + '</b></div></div>' +
        '<div class="cols"><div>' + kv(facts) + '</div><div>' + researchHead(s.id) +
        (rv ? reviewTiles(rv) + (rv.comment ? '<div class="rv-note"><span class="muted small">Supervisor comment</span><br>' + esc(rv.comment) + '</div>' : '')
            : '<p class="muted" style="margin:0">Not rated for ' + esc(per) + '.</p>') + '</div></div></section>';
    }).join('');
  }).join('');

  return '<div class="page-h noprint"><div><h1>Report</h1><div class="sub">Slides for the supervisor and trainee meeting, built from the saved ratings</div></div><span class="spacer"></span>' +
    '<button class="btn pri" data-act="print">Print or save as PDF</button></div>' +
    '<div class="toolbar"><select class="input" data-rep="period" aria-label="Review period">' + Object.keys(periods).sort().reverse().map(function (p) {
      return '<option' + (p === per ? ' selected' : '') + '>' + esc(p) + '</option>';
    }).join('') + '</select>' +
    '<label class="chk"><input type="checkbox" data-rep="unrated"' + (ui.unrated ? ' checked' : '') + '> Include trainees not yet rated</label>' +
    '<label class="chk"><input type="checkbox" data-rep="ic"' + (ui.ic ? ' checked' : '') + '> Show IC numbers</label><span class="spacer"></span>' +
    (nSampleAll ? '<button class="btn sm bad" data-act="sampleClear">Remove sample ratings (' + nSampleAll + ')</button>' : '') +
    (per === cur ? '<button class="btn sm" data-act="sampleAdd">Add sample ratings</button>' : '') + '</div>' +
    (scheme().length ? '<div class="report">' + cover + summary + alloc + slides + '</div>' : card('Report not available yet', '<p class="muted" style="margin:0">The server has not been updated for progress ratings.</p>'));

var AUDIT = { rows: null, loading: false };

    AUDIT.loading = true;
    api('audit', S.token, 300).then(function (r) { AUDIT.rows = r; }, function (e) { toast(e.message, 'bad'); AUDIT.rows = []; })

function leaveForm(o, cb) {
  var l = o.leave || {}, types = list(set_().LEAVE_TYPES);
  var fields = [
    { name: 'type', label: 'Leave type', type: 'select', options: types, value: l.type || types[0], required: true },
    { name: 'startDate', label: 'From', type: 'date', value: l.startDate || '', required: true },
    { name: 'endDate', label: 'To', type: 'date', value: l.endDate || '', hint: 'Leave empty for a single day.' },
    { name: 'halfDay', label: 'Half day (single day only)', type: 'checkbox', value: l.halfDay },
    { name: 'reason', label: 'Reason', type: 'textarea', value: l.reason || '', max: 500 }
  ];
  if (o.admin) fields.push({ name: 'status', label: 'Status', type: 'select', options: ['Pending', 'Approved', 'Rejected', 'Cancelled'], value: l.status },
                           { name: 'decisionNote', label: 'Decision note', type: 'text', value: l.decisionNote || '' });
  form({ title: o.title, submit: o.submit || 'Save', fields: fields,
    preview: function (v) {
      if (!v.startDate) return '';
      var end = v.endDate || v.startDate;
      if (end < v.startDate) return '';
      var n = workingDays(v.startDate, end, v.halfDay), bal = leaveSum(o.studentId);
      var b = v.type === 'Annual' ? bal.annual : v.type === 'Emergency' ? bal.emergency : null;
      return plural(n, 'working day') + ' (weekends and public holidays skipped)' + (b && !o.leave ? ' · ' + (b.left - n) + ' ' + v.type.toLowerCase() + ' days left after this' : '');
    },
    validate: function (v) {
      var end = v.endDate || v.startDate;
      if (end < v.startDate) return 'The end date is before the start date.';
      if (!workingDays(v.startDate, end, v.halfDay)) return 'Those dates are all weekends or public holidays.';
      return '';
    },
    onSubmit: function (v) { v.endDate = v.endDate || v.startDate; cb(v); } });
}

/* ========================================================= EVENT WIRING */

document.addEventListener('click', function (e) {
  if (!S.d) return;
  var a = e.target.closest('[data-act]');
  if (a && $('app').contains(a) || a && $('modalRoot').contains(a)) {
    var fn = A[a.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(a.getAttribute('data-id'), a); return; }
  }
  var g = e.target.closest('[data-go]');
  if (g && !e.target.closest('a')) { e.preventDefault(); go(g.getAttribute('data-go')); }
});
document.addEventListener('input', function (e) {
  if (!S.d) return;
  if (e.target.id === 'aq') { S.ui.q = e.target.value; render(); }
  if (e.target.id === 'sq') { S.ui.sq = e.target.value; render(); }
});
document.addEventListener('change', function (e) {
  if (!S.d) return;
  var k = e.target.getAttribute('data-filter');
  if (k) { S.ui.f[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; delete S.ui.f.soon; delete S.ui.f.noEmail; render(); }
  if (e.target.getAttribute('data-act-change') === 'planUni') { S.ui.planUni = e.target.value; render(); }
  var rk = e.target.getAttribute('data-rep');
  if (rk) { S.ui.rep[rk] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; render(); }
});

/* Refresh quietly when the tab comes back after a while, so data from other users shows up. */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !S.token || !S.d || S.busy || MODAL) return;
  if (Date.now() - S.loadedAt < 5 * 60 * 1000) return;
  backgroundRefresh();
});
function backgroundRefresh() {
  var tok = S.token;
  busy(1);
  return api('bootstrap', tok).then(function (d) { if (S.token === tok) { setData(d); render(); } }, function () {}).finally(function () { busy(-1); });
}

(function start() {
  if (/PASTE_WEB_APP_URL_HERE/.test(API_URL)) {
    document.body.innerHTML = '<div class="login"><div class="card" style="max-width:520px"><h2>Setup needed</h2><p>Open <b>index.html</b> and paste your Apps Script web app URL into <span class="mono">API_URL</span> near the top.</p></div></div>';
    return;
  }
  var tok = null, snap = null;
  try { tok = sessionStorage.getItem(TOKEN_KEY); snap = JSON.parse(sessionStorage.getItem(SNAP_KEY) || 'null'); } catch (e) {}
  if (tok && snap && snap.me) {
    // Show the last data instantly, then refresh in the background.
    S.token = tok; setData(snap); enterApp(); backgroundRefresh();
  } else showLogin();
})();
